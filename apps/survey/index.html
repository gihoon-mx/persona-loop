<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Loop — Survey</title>
<link rel="stylesheet" href="../../assets/styles.css">
<style>
/* survey 모듈 전용 최소 스타일 */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
.table-wrap table { min-width:640px; }
.steps { display:flex; gap:8px; font-size:.8rem; color:var(--muted); margin:4px 0 18px; }
.steps span { padding:2px 10px; border:1px solid var(--border); border-radius:99px; }
.steps span.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.qcard { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.qcard .qtext { font-size:.95rem; font-weight:600; margin-bottom:8px; }
.opt-line { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:.9rem; }
.opt-line input { width:auto; }
.likert-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.likert-row label { display:flex; flex-direction:column; align-items:center; gap:4px; margin:0;
  border:1px solid var(--border); border-radius:8px; padding:8px 0; flex:1; min-width:40px;
  font-size:.8rem; color:var(--fg); cursor:pointer; }
.likert-row label:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
.likert-ends { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-top:4px; }
.editor-q { border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; background:var(--card); }
.editor-q .head { display:flex; justify-content:space-between; align-items:center; }
.editor-grid { display:grid; gap:0 14px; grid-template-columns:1fr 1fr; }
@media (max-width:560px) { .editor-grid { grid-template-columns:1fr; } }
.progress-log { font-size:.88rem; margin-top:14px; }
.progress-log li { margin:4px 0; }
.answers-list li { font-size:.88rem; margin:6px 0; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.answers-list .who { display:block; font-size:.72rem; color:var(--muted); }
.num-summary { display:flex; gap:18px; font-size:.9rem; flex-wrap:wrap; }
.num-summary b { font-size:1.1rem; }
.q-missing { outline:2px solid var(--danger); }

/* 결과 보기 전환 (문항별 ↔ 응답자별) */
.view-chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 2px; }
.view-chips a { font-size:.85rem; text-decoration:none; padding:5px 15px; border-radius:99px;
  border:1px solid var(--border); background:var(--card); color:var(--muted); }
.view-chips a:hover { border-color:var(--accent); }
.view-chips a.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:600; }

/* 응답자별 보기 — 응답자 1명 = 응답 문서 1건 */
.resp-card h3 { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.resp-card .resp-preview { font-size:.86rem; color:var(--fg); margin-top:10px;
  display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ans { font-size:.95rem; }
.ans.none { font-size:.85rem; color:var(--muted); }
.pill { display:inline-block; font-size:.82rem; padding:2px 10px; margin:2px 6px 2px 0;
  border-radius:99px; border:1px solid var(--border); background:var(--bg); }
.free-text { margin:8px 0 2px; padding:10px 14px; border-left:3px solid var(--accent);
  background:var(--accent-soft); border-radius:0 8px 8px 0; font-size:.9rem; white-space:pre-wrap; }
.free-text .who { display:block; margin-top:6px; font-size:.72rem; color:var(--muted); }

/* now-here-survey 연동 뷰 */
input[type=password] { width:100%; font:inherit; font-size:.92rem; padding:8px 10px;
  border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--fg); }
.link-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
button.card.pick { width:100%; text-align:left; font:inherit; cursor:pointer; }
button.card.pick:hover { border-color:var(--accent); }
button.card.pick[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); }
/* 페르소나 차원 열 — 연동의 부가가치라 눈에 띄게 둔다 */
th.dim-col, td.dim-col { background:var(--accent-soft); }
th.dim-col { color:var(--accent); }
td.dim-col select { min-width:130px; }
</style>
</head>
<body>
<header class="topbar"></header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<footer class="site">Persona Loop <span data-app-ver>v0.5.0</span> · Survey 모듈 · 리뷰는 AI 생성물로 항상 표시됩니다</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
