<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Loop — Survey</title>
<link rel="stylesheet" href="../../assets/styles.css">
<style>
/* survey 모듈 전용 최소 스타일 */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
.table-wrap table { min-width:640px; }
.steps { display:flex; gap:8px; font-size:.8rem; color:var(--muted); margin:4px 0 18px; }
.steps span { padding:2px 10px; border:1px solid var(--border); border-radius:99px; }
.steps span.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.qcard { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
.qcard .qtext { font-size:.95rem; font-weight:600; margin-bottom:8px; }
.opt-line { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:.9rem; }
.opt-line input { width:auto; }
.likert-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.likert-row label { display:flex; flex-direction:column; align-items:center; gap:4px; margin:0;
  border:1px solid var(--border); border-radius:8px; padding:8px 0; flex:1; min-width:40px;
  font-size:.8rem; color:var(--fg); cursor:pointer; }
.likert-row label:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
.likert-ends { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-top:4px; }
.editor-q { border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; background:var(--card); }
.editor-q .head { display:flex; justify-content:space-between; align-items:center; }
.editor-grid { display:grid; gap:0 14px; grid-template-columns:1fr 1fr; }
@media (max-width:560px) { .editor-grid { grid-template-columns:1fr; } }
.progress-log { font-size:.88rem; margin-top:14px; }
.progress-log li { margin:4px 0; }
.answers-list li { font-size:.88rem; margin:6px 0; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.answers-list .who { display:block; font-size:.72rem; color:var(--muted); }
.num-summary { display:flex; gap:18px; font-size:.9rem; flex-wrap:wrap; }
.num-summary b { font-size:1.1rem; }
.q-missing { outline:2px solid var(--danger); }
</style>
</head>
<body>
<header class="topbar"></header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<footer class="site">Persona Loop <span data-app-ver>v0.2.0</span> · Survey 모듈 · 리뷰는 AI 생성물로 항상 표시됩니다</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
