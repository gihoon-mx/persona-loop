<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Loop</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar"></header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<footer class="site">Persona Loop <span data-app-ver>v0.5.0</span> · <a href="https://github.com/gihoon-mx/persona-loop">GitHub</a> · 리뷰는 AI 생성물로 항상 표시됩니다</footer>

<dialog id="newProjectDlg">
  <h3>새 프로젝트</h3>
  <form id="newProjectForm" method="dialog">
    <label>ID (소문자·숫자·하이픈, 변경 불가)</label>
    <input type="text" name="id" required pattern="[a-z0-9-]{2,40}" placeholder="now-here">
    <label>이름</label>
    <input type="text" name="name" required placeholder="Now Here">
    <label>설명</label>
    <textarea name="description" placeholder="어떤 서비스를 검증하는 프로젝트인지"></textarea>
    <label>데모 URL (페르소나 Agent가 사용해볼 주소)</label>
    <input type="url" name="demoUrl" placeholder="https://gihoon-mx.github.io/now-here-demo/">
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:18px;">
      <button type="button" class="btn" id="dlgCancel">취소</button>
      <button type="submit" class="btn primary">만들기</button>
    </div>
  </form>
</dialog>

<script type="module">
import * as core from './packages/core/core.js';
const { esc, qsParam, state } = core;
const app = document.getElementById('app');

main().catch((e) => {
  app.innerHTML = `<p class="empty">불러오는 중 오류가 발생했습니다: ${esc(e.message)}</p>`;
});

async function main() {
  await core.initCore();
  core.renderTopbar('./'); // 게이트와 무관하게 항상 — 상단바에 로그인 버튼이 필요하다

  // 비공개 기본: admin이 아니면 여기서 끝. 아래 뷰는 아무것도 그리지 않는다.
  if (!(await core.requireAdmin(app))) return;

  const view = qsParam('view');
  const projectId = qsParam('p');
  if (view === 'settings') await renderSettings();
  else if (projectId) await renderProjectHome(projectId);
  else await renderProjectList();
}

// ---------- 공통: 샘플 데이터 불러오기 ----------
function wireSeedButton(btn) {
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '불러오는 중…';
    try {
      await core.seedSampleProject();
      location.href = './'; // 완료되면 목록 새로고침
    } catch (e) {
      alert(`샘플 데이터를 불러오지 못했습니다: ${e.message}`);
      btn.disabled = false;
      btn.textContent = label;
    }
  });
}

// ---------- 뷰 1: 프로젝트 목록/생성 ----------
async function renderProjectList() {
  let projects = [];
  try { projects = await core.listProjects(); }
  catch (e) { app.innerHTML = `<p class="empty">프로젝트를 불러오지 못했습니다: ${esc(e.message)}</p>`; return; }

  app.innerHTML = `
    <div class="section-head">
      <h2>프로젝트</h2>
      <button class="btn primary" id="newBtn">+ 새 프로젝트</button>
    </div>
    <div class="grid cols2" id="plist">
      ${projects.length ? projects.map((p) => `
        <a class="card" href="?p=${esc(p.id)}">
          <h3>${esc(p.name)} <span class="badge ${p.status === 'active' ? 'ok' : ''}">${esc(p.status || 'active')}</span>${
            p.isSample ? ' <span class="badge">샘플</span>' : ''}</h3>
          <p>${esc(p.description || '')}</p>
          <p class="small muted">${esc(p.id)}</p>
        </a>`).join('')
        : `<div class="card" style="grid-column:1/-1">
             <p class="empty" style="padding:24px 0">아직 프로젝트가 없습니다.<br>새 프로젝트를 만들거나 샘플 데이터로 전체 흐름을 먼저 확인해보세요.</p>
             <p style="text-align:center"><button class="btn" id="seedBtn">샘플 데이터 불러오기</button></p>
             <p class="small muted" style="text-align:center; margin-top:8px">가상의 데모 프로젝트를 Firestore에 만들어 전체 흐름을 볼 수 있습니다.</p>
           </div>`}
    </div>
    <p class="small muted" style="margin-top:20px">프로젝트 = 검증할 서비스 하나. 프로젝트를 선택하면 서베이 → 페르소나 → 리뷰 모듈로 이어집니다.</p>`;
  core.renderModeBanner(app);

  wireSeedButton(document.getElementById('seedBtn'));

  const dlg = document.getElementById('newProjectDlg');
  document.getElementById('newBtn').addEventListener('click', () => dlg.showModal());
  document.getElementById('dlgCancel').addEventListener('click', () => dlg.close());
  document.getElementById('newProjectForm').addEventListener('submit', async (ev) => {
    ev.preventDefault(); // method=dialog의 자동 닫힘 방지 — 성공했을 때만 닫는다
    const fd = new FormData(ev.target);
    const submitBtn = ev.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = '만드는 중…';
    try {
      await core.createProject(Object.fromEntries(fd.entries()));
      dlg.close();
      location.search = `?p=${fd.get('id')}`;
    } catch (e) {
      alert(e.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '만들기';
    }
  });
}

// ---------- 뷰 2: 프로젝트 홈 (모듈 진입) ----------
async function renderProjectHome(pid) {
  const project = await core.getProject(pid);
  if (!project) {
    app.innerHTML = `<div class="crumb"><a href="./">← 프로젝트 목록</a></div>
      <p class="empty">프로젝트 '${esc(pid)}'를 찾을 수 없습니다.</p>`;
    return;
  }
  const [surveys, personas, reviews] = await Promise.all([
    core.listSurveys(pid).catch(() => []),
    core.listArtifacts(pid, 'personas').catch(() => []),
    core.listArtifacts(pid, 'reviews').catch(() => []),
  ]);
  app.innerHTML = `
    <div class="crumb"><a href="./">← 프로젝트 목록</a></div>
    <div class="section-head" style="margin-top:0">
      <h2>${esc(project.name)}${project.isSample ? ' <span class="badge">샘플</span>' : ''}</h2>
      ${core.safeUrl(project.demoUrl) ? `<a class="btn" href="${esc(core.safeUrl(project.demoUrl))}"
        target="_blank" rel="noopener noreferrer">데모 열기 ↗</a>` : ''}
    </div>
    <p class="muted" style="margin:-8px 0 20px">${esc(project.description || '')}</p>
    <div class="grid cols3">
      <a class="card" href="apps/survey/?p=${esc(pid)}">
        <h3>1. Survey</h3>
        <p>서베이 생성·임포트·결과 분석</p>
        <p class="small">서베이 ${surveys.length}개</p>
      </a>
      <a class="card" href="apps/persona/?p=${esc(pid)}">
        <h3>2. Persona</h3>
        <p>응답 근거로 만든 페르소나</p>
        <p class="small">페르소나 ${personas.length}명</p>
      </a>
      <a class="card" href="apps/review/?p=${esc(pid)}">
        <h3>3. Review</h3>
        <p>Agent 사용 세션 + 리뷰</p>
        <p class="small">리뷰 ${reviews.length}건</p>
      </a>
    </div>`;
  core.renderModeBanner(app);
}

// ---------- 뷰 3: 설정 (소유자 전용) ----------
async function renderSettings() {
  if (!state.isOwner) {
    app.innerHTML = `
      <div class="crumb"><a href="./">← 프로젝트 목록</a></div>
      <div class="gate">
        <h2>소유자 전용</h2>
        <p class="muted">이 화면은 소유자만 사용할 수 있습니다.</p>
        <p><a class="btn" href="./">프로젝트 목록으로</a></p>
      </div>`;
    return;
  }

  app.innerHTML = `
    <div class="crumb"><a href="./">← 프로젝트 목록</a></div>
    <div class="section-head" style="margin-top:0"><h2>설정</h2></div>

    <div class="card">
      <h3>접근 권한 관리</h3>
      <p class="small muted" style="margin-top:6px">여기에 추가된 Google 계정만 로그인 후 데이터를 볼 수 있습니다. Firestore 보안 규칙이 서버 측에서 동일하게 강제합니다.</p>
      <div id="adminBox"><p class="empty" style="padding:24px 0">불러오는 중…</p></div>
      <form id="addAdminForm" style="margin-top:16px">
        <label for="adminEmail">관리자 추가 (Google 계정 이메일)</label>
        <div style="display:flex; gap:8px; align-items:center">
          <input type="text" id="adminEmail" name="email" placeholder="teammate@example.com" autocomplete="off">
          <button type="submit" class="btn primary">추가</button>
        </div>
      </form>
      <p class="small muted" style="margin-top:14px">소유자 계정 변경은 firestore.rules와 firebase-config.js를 함께 수정해야 합니다.</p>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>샘플 데이터</h3>
      <p class="small muted" style="margin-top:6px">가상의 데모 프로젝트를 Firestore에 만들어 전체 흐름을 볼 수 있습니다.</p>
      <p style="margin-top:12px"><button class="btn" id="seedBtn">샘플 데이터 불러오기</button></p>
    </div>`;

  wireSeedButton(document.getElementById('seedBtn'));

  document.getElementById('addAdminForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.getElementById('adminEmail');
    const email = input.value.trim();
    if (!email) { alert('이메일 주소를 입력하세요.'); input.focus(); return; }
    const submitBtn = ev.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = '추가 중…';
    try {
      await core.addAdmin(email);
      input.value = '';
      await drawAdmins();
    } catch (e) {
      alert(e.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '추가';
    }
  });

  await drawAdmins();
  core.renderModeBanner(app); // 목록 로드 뒤에 — 연결 실패를 여기서 알려야 한다
}

async function drawAdmins() {
  const box = document.getElementById('adminBox');
  if (!box) return;
  let rows = [];
  try { rows = await core.listAdmins(); }
  catch (e) {
    box.innerHTML = `<p class="empty" style="padding:24px 0">관리자 목록을 불러오지 못했습니다: ${esc(e.message)}</p>`;
    return;
  }
  box.innerHTML = `
    <table style="margin-top:14px">
      <thead><tr><th>이메일</th><th>추가한 사람</th><th>추가일</th><th></th></tr></thead>
      <tbody>
        <tr>
          <td>${esc(core.OWNER_EMAIL)} <span class="badge accent">소유자 · 상시 관리자</span></td>
          <td class="muted">—</td>
          <td class="muted">—</td>
          <td></td>
        </tr>
        ${rows.map((r) => `
          <tr>
            <td>${esc(r.email)}</td>
            <td class="muted">${esc(r.addedBy || '—')}</td>
            <td class="muted">${esc(fmtDate(r.addedAt))}</td>
            <td style="text-align:right"><button class="btn" data-remove="${esc(r.email)}">삭제</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
    ${rows.length ? '' : '<p class="small muted" style="margin-top:10px">추가된 관리자가 없습니다. 현재는 소유자 계정만 접근할 수 있습니다.</p>'}`;

  box.querySelectorAll('[data-remove]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const email = btn.getAttribute('data-remove');
      if (!confirm(`${email} 계정의 접근 권한을 삭제할까요?`)) return;
      btn.disabled = true;
      try {
        await core.removeAdmin(email);
        await drawAdmins();
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
      }
    });
  });
}

/** Firestore Timestamp · Date · 문자열 무엇이 와도 안전하게 날짜 문자열로 */
function fmtDate(v) {
  try {
    let d = null;
    if (v && typeof v.toDate === 'function') d = v.toDate();
    else if (v instanceof Date) d = v;
    else if (typeof v === 'string' || typeof v === 'number') d = new Date(v);
    if (!d || isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('ko-KR');
  } catch { return '—'; }
}
</script>
</body>
</html>
