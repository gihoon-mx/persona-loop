<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Loop</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fafafa; --card:#fff; --muted:#666; --accent:#4a5cf0; --border:#e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececec; --bg:#131316; --card:#1c1c21; --muted:#9a9aa3; --border:#2a2a31; } }
  * { margin:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; color:var(--fg); background:var(--bg); line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.9rem; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .tagline { color:var(--muted); margin:8px 0 36px; }
  .modules { display:grid; gap:14px; }
  .card { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; text-decoration:none; color:inherit; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .card h2 { font-size:1.05rem; }
  .card p { font-size:.88rem; color:var(--muted); margin-top:4px; }
  .badge { display:inline-block; font-size:.7rem; padding:1px 8px; border-radius:99px; border:1px solid var(--border); color:var(--muted); margin-left:8px; vertical-align:2px; }
  footer { margin-top:48px; font-size:.78rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Persona <span>Loop</span></h1>
  <p class="tagline">서베이 → 페르소나 → AI Agent 데모 사용 → 리뷰 → 개선. 실제 응답에서 출발하는 리서치 루프.</p>
  <div class="modules">
    <a class="card" href="apps/survey/">
      <h2>Survey <span class="badge">준비 중</span></h2>
      <p>서베이 생성·코칭, 실시간 수집, 결과 대시보드</p>
    </a>
    <a class="card" href="apps/persona/">
      <h2>Persona <span class="badge">준비 중</span></h2>
      <p>응답 근거에 연결된 페르소나 생성·관리</p>
    </a>
    <a class="card" href="apps/review/">
      <h2>Review <span class="badge">준비 중</span></h2>
      <p>페르소나 Agent의 사용 세션 리플레이 + 리뷰</p>
    </a>
  </div>
  <footer>Persona Loop <span data-app-ver>v0.1.0</span> · <a href="https://github.com/gihoon-mx/persona-loop" style="color:inherit">GitHub</a> · 리뷰는 AI 생성물로 항상 표시됩니다</footer>
</main>
</body>
</html>
