<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Loop</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar"></header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<footer class="site">Persona Loop <span data-app-ver>v0.2.0</span> · <a href="https://github.com/gihoon-mx/persona-loop">GitHub</a> · 리뷰는 AI 생성물로 항상 표시됩니다</footer>

<dialog id="newProjectDlg">
  <h3>새 프로젝트</h3>
  <form id="newProjectForm" method="dialog">
    <label>ID (소문자·숫자·하이픈, 변경 불가 — repo 데이터 폴더명과 연결됨)</label>
    <input type="text" name="id" required pattern="[a-z0-9-]{2,40}" placeholder="now-here">
    <label>이름</label>
    <input type="text" name="name" required placeholder="Now Here">
    <label>설명</label>
    <textarea name="description" placeholder="어떤 서비스를 검증하는 프로젝트인지"></textarea>
    <label>데모 URL (페르소나 Agent가 사용해볼 주소)</label>
    <input type="url" name="demoUrl" placeholder="https://gihoon-mx.github.io/now-here-demo/">
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:18px;">
      <button type="button" class="btn" id="dlgCancel">취소</button>
      <button type="submit" class="btn primary">만들기</button>
    </div>
  </form>
</dialog>

<script type="module">
import * as core from './packages/core/core.js';
const { esc, qsParam, state } = core;
const app = document.getElementById('app');

core.initCore();
core.renderTopbar('./');

const projectId = qsParam('p');
(projectId ? renderProjectHome(projectId) : renderProjectList()).catch((e) => {
  app.innerHTML = `<p class="empty">불러오는 중 오류가 발생했습니다: ${esc(e.message)}</p>`;
});

// ---------- 뷰 1: 프로젝트 목록/생성 ----------
async function renderProjectList() {
  let projects = [];
  try { projects = await core.listProjects(); }
  catch (e) { app.innerHTML = `<p class="empty">프로젝트를 불러오지 못했습니다: ${esc(e.message)}</p>`; return; }

  const draw = () => {
    app.innerHTML = `
      <div class="section-head">
        <h2>프로젝트</h2>
        ${state.mode === 'firebase' && state.isAdmin ? '<button class="btn primary" id="newBtn">+ 새 프로젝트</button>' : ''}
      </div>
      <div class="grid cols2" id="plist">
        ${projects.length ? projects.map((p) => `
          <a class="card" href="?p=${esc(p.id)}">
            <h3>${esc(p.name)} <span class="badge ${p.status === 'active' ? 'ok' : ''}">${esc(p.status || 'active')}</span></h3>
            <p>${esc(p.description || '')}</p>
            <p class="small muted">${esc(p.id)}</p>
          </a>`).join('')
          : `<div class="card"><p class="empty" style="padding:24px 0">아직 프로젝트가 없습니다.${state.mode === 'firebase' ? ' 로그인 후 새 프로젝트를 만들어보세요.' : ''}</p></div>`}
      </div>
      <p class="small muted" style="margin-top:20px">프로젝트 = 검증할 서비스 하나. 프로젝트를 선택하면 서베이 → 페르소나 → 리뷰 모듈로 이어집니다.</p>`;
    core.renderModeBanner(app);

    document.getElementById('newBtn')?.addEventListener('click', () => {
      document.getElementById('newProjectDlg').showModal();
    });
  };
  draw();
  core.onAuthChange(draw); // 로그인 상태 바뀌면 버튼 노출 갱신

  const dlg = document.getElementById('newProjectDlg');
  document.getElementById('dlgCancel').addEventListener('click', () => dlg.close());
  document.getElementById('newProjectForm').addEventListener('submit', async (ev) => {
    ev.preventDefault(); // method=dialog의 자동 닫힘 방지 — 성공했을 때만 닫는다
    const fd = new FormData(ev.target);
    const submitBtn = ev.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = '만드는 중…';
    try {
      await core.createProject(Object.fromEntries(fd.entries()));
      dlg.close();
      location.search = `?p=${fd.get('id')}`;
    } catch (e) {
      alert(e.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '만들기';
    }
  });
}

// ---------- 뷰 2: 프로젝트 홈 (모듈 진입) ----------
async function renderProjectHome(pid) {
  const project = await core.getProject(pid);
  if (!project) {
    app.innerHTML = `<div class="crumb"><a href="./">← 프로젝트 목록</a></div>
      <p class="empty">프로젝트 '${esc(pid)}'를 찾을 수 없습니다.</p>`;
    return;
  }
  const [surveys, personas, reviews] = await Promise.all([
    core.listSurveys(pid).catch(() => []),
    core.listArtifacts(pid, 'personas'),
    core.listArtifacts(pid, 'reviews'),
  ]);
  app.innerHTML = `
    <div class="crumb"><a href="./">← 프로젝트 목록</a></div>
    <div class="section-head" style="margin-top:0">
      <h2>${esc(project.name)}</h2>
      ${project.demoUrl ? `<a class="btn" href="${esc(project.demoUrl)}" target="_blank">데모 열기 ↗</a>` : ''}
    </div>
    <p class="muted" style="margin:-8px 0 20px">${esc(project.description || '')}</p>
    <div class="grid cols3">
      <a class="card" href="apps/survey/?p=${esc(pid)}">
        <h3>1. Survey</h3>
        <p>서베이 생성·임포트·결과 분석</p>
        <p class="small">서베이 ${surveys.length}개</p>
      </a>
      <a class="card" href="apps/persona/?p=${esc(pid)}">
        <h3>2. Persona</h3>
        <p>응답 근거로 만든 페르소나</p>
        <p class="small">페르소나 ${personas.length}명</p>
      </a>
      <a class="card" href="apps/review/?p=${esc(pid)}">
        <h3>3. Review</h3>
        <p>Agent 사용 세션 + 리뷰</p>
        <p class="small">리뷰 ${reviews.length}건</p>
      </a>
    </div>`;
  core.renderModeBanner(app);
}
</script>
</body>
</html>
